services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: algo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-algo_tutor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-algo_tutor_secret}
      POSTGRES_DB: ${POSTGRES_DB:-algo_tutor}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-algo_tutor}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: algo-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: algo-backend
    command: >
      sh -c "python -m scripts.repair_alembic_version &&
      alembic upgrade head &&
      python -m scripts.seed_db &&
      python -m scripts.migrate_demo_to_official &&
      python -m scripts.reorganize_categories &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data   # 外部知识源与提取产物（灌库脚本读取）
      - /var/run/docker.sock:/var/run/docker.sock   # 后端 spawn 兄弟沙箱容器
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sandbox-build:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    container_name: algo-frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Keep Linux native dependencies out of the Windows bind mount.
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  # Celery worker (Task 8): 执行 CF 同步任务
  celery-worker:
    build: ./backend
    container_name: algo-celery-worker
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=2 --hostname=worker@%h
    user: "10001:10001"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery beat (Task 8): 定时调度 CF 同步任务
  # 注意：仅部署一个 beat 实例以避免重复调度；数据库写入仍必须幂等
  celery-beat:
    build: ./backend
    container_name: algo-celery-beat
    command: celery -A app.celery_app.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    user: "10001:10001"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 沙箱镜像构建服务：启动时先完成镜像构建，不常驻。
  # backend 依赖该一次性服务，避免首次启动时 execute_code 找不到镜像。
  sandbox-build:
    build: ./backend/sandbox
    image: algo-sandbox:latest
    command: ["echo", "sandbox image built"]

volumes:
  pgdata:
  redisdata:
  frontend_node_modules:
